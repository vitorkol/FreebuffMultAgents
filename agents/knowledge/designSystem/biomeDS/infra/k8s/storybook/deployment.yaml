apiVersion: apps/v1
kind: Deployment
metadata:
  name: biome-storybook
  labels:
    app.kubernetes.io/name: biome-storybook
    app.kubernetes.io/part-of: pseg
    app.kubernetes.io/component: documentation
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: biome-storybook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: biome-storybook
        app.kubernetes.io/part-of: pseg
        app.kubernetes.io/component: documentation
    spec:
      containers:
        - name: storybook
          image: dockerhub.meioambiente.mg.gov.br/semad/biome-storybook:${CI_COMMIT_SHORT_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: PORT
              value: "80"
            - name: STORYBOOK_STATIC_DIR
              value: /app/storybook-static
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
