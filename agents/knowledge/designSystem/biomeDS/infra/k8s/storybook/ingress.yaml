apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biome-storybook
  labels:
    app.kubernetes.io/name: biome-storybook
    app.kubernetes.io/part-of: pseg
    app.kubernetes.io/component: documentation
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
    - host: biome.meioambiente.mg.gov.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biome-storybook
                port:
                  name: http
  tls:
    - hosts:
        - biome.meioambiente.mg.gov.br
      secretName: biome-storybook-tls
