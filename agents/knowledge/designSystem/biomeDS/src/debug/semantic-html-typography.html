<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biome DS — tipografia só com HTML semântico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>
  <body class="bg-background text-foreground">
    <main style="max-width: 40rem; padding: 2rem">
      <h1>Título nível 1 (sem classes)</h1>
      <h2>Título nível 2</h2>
      <h3>Título nível 3</h3>
      <p>
        Parágrafo de corpo — deve usar Roboto, tamanho base e entrelinha normal apenas via <code>:root</code> e
        <code>@layer base</code>.
      </p>
      <small>Texto em &lt;small&gt; — mesmo estilo que <code>.text-meta-xs</code> (tokens)</small>
      <p style="margin-top: 2rem">
        <label for="x">Exemplo de label</label><br />
        <input id="x" type="text" placeholder="Input herda base" style="margin-top: 0.25rem; width: 100%; max-width: 20rem" />
      </p>
    </main>
    <script>
      ;["h1", "h2", "h3", "p", "small", "label", "input"].forEach(function (sel) {
        var el = document.querySelector(sel)
        if (!el) return
        var s = getComputedStyle(el)
        console.log(sel, {
          fontSize: s.fontSize,
          fontFamily: s.fontFamily.split(",")[0],
          fontWeight: s.fontWeight,
          lineHeight: s.lineHeight,
        })
      })
    </script>
  </body>
</html>
